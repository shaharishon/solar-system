<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage">
    <canvas id="sky" aria-label="Animated solar system"></canvas>
    <div class="hud">
      <p class="eyebrow">Live simulation</p>
      <h1>Solar System</h1>
      <p>Eight worlds, lit by the Sun</p>
    </div>
  </div>
  <aside class="sidebar" aria-label="Planets">
    <p class="eyebrow">Planets</p>
    <ul class="legend">
      <li><span style="background:#b7aa9a"></span>Mercury</li>
      <li><span style="background:#e6c98a"></span>Venus</li>
      <li><span style="background:#3d7ec4"></span>Earth</li>
      <li><span style="background:#c45a3a"></span>Mars</li>
      <li><span style="background:#d7b48a"></span>Jupiter</li>
      <li><span style="background:#e4d2a8"></span>Saturn</li>
      <li><span style="background:#8fd8d0"></span>Uranus</li>
      <li><span style="background:#3d5ec4"></span>Neptune</li>
    </ul>
  </aside>
  <script src="script.js"></script>
</body>
</html>
